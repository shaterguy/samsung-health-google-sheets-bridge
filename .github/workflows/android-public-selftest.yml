name: Android Public Self-Test

on:
  push:
    branches: [main, 'ci-fallback/**']
    paths:
      - ".github/workflows/android-public-selftest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: >-
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[gh-fallback:android-public-selftest.yml]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK packages
        id: sdk
        continue-on-error: true
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build public source
        id: build
        if: steps.sdk.outcome == 'success'
        continue-on-error: true
        working-directory: android
        shell: bash
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease
      - name: Record self-test result
        if: always()
        shell: bash
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          overall=failure
          if [[ "$SDK_OUTCOME" == "success" && "$BUILD_OUTCOME" == "success" ]]; then
            overall=success
          fi
          mkdir -p .github
          cat > .github/public-source-selftest.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "run_id": "$GITHUB_RUN_ID",
            "source_sha": "$GITHUB_SHA",
            "android_sdk": "$SDK_OUTCOME",
            "unit_tests_and_build": "$BUILD_OUTCOME",
            "conclusion": "$overall",
            "public_source_build_independent": true,
            "external_private_repo_dependency": false,
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/public-source-selftest.json
          git commit -m 'Record public Health Bridge source self-test'
          git push
          [[ "$overall" == "success" ]]
