name: Android Install Smoke

on:
  push:
    branches: [main, 'ci-fallback/**']
    paths:
      - ".github/workflows/android-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    if: >-
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[gh-fallback:android-install-smoke.yml]'))
    name: Clean install on Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      GH_TOKEN: ${{ github.token }}
      APK_NAME: HealthBridge-v0.3.3.apk
      PACKAGE_NAME: com.example.healthbridge
      AVD_NAME: healthbridge-install-smoke
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            "platforms;android-${{ matrix.api }}" \
            "system-images;android-${{ matrix.api }};google_apis;x86_64"
          echo no | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-${{ matrix.api }};google_apis;x86_64" \
            --device pixel_6

      - name: Boot clean emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          nohup emulator "@$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -wipe-data \
            > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abi

      - name: Download verified public APK
        shell: bash
        run: |
          set -euo pipefail
          gh release download v0.3.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_NAME"
          test -s "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Install APK on clean emulator
        id: install
        shell: bash
        run: |
          set +e
          adb install --user 0 -r -t "$APK_NAME" 2>&1 | tee adb-install-output.txt
          CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            echo "PackageManager clean-install failed with exit code $CODE" >&2
            exit "$CODE"
          fi
          adb shell pm path "$PACKAGE_NAME" | tee package-path.txt
          adb shell dumpsys package "$PACKAGE_NAME" | grep -E 'versionCode=|versionName=' | head -n 4 | tee package-version.txt

      - name: Capture package-manager diagnostics
        if: always()
        shell: bash
        run: |
          adb shell dumpsys package "$PACKAGE_NAME" > package-dumpsys.txt 2>&1 || true
          adb shell logcat -d -b all | grep -Ei 'PackageInstaller|PackageManager|INSTALL_|healthbridge|com.example.healthbridge' | tail -n 800 > package-install-logcat.txt || true
          tail -n 500 emulator.log > emulator-tail.txt 2>/dev/null || true

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthbridge-install-smoke-api-${{ matrix.api }}
          path: |
            adb-install-output.txt
            package-path.txt
            package-version.txt
            package-dumpsys.txt
            package-install-logcat.txt
            emulator-tail.txt
          if-no-files-found: ignore
          retention-days: 7
