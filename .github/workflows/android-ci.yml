name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - "README.md"
      - "BUILD-VERIFICATION.md"
      - "PUBLIC_OAUTH_SETUP.md"
      - "SIGNING_POLICY.md"
      - ".github/workflows/android-*.yml"
  push:
    branches:
      - main
      - 'ci-fallback/**'
    paths:
      - "android/**"
      - "README.md"
      - "BUILD-VERIFICATION.md"
      - "PUBLIC_OAUTH_SETUP.md"
      - "SIGNING_POLICY.md"
      - ".github/workflows/android-*.yml"

  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    if: >-
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[gh-fallback:android-ci.yml]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build debug APK
        working-directory: android
        shell: bash
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload debug APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: health-bridge-v0.3.3-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
