name: Android Stable Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-bridge-public-stable
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.3.6
  FALLBACK_RELEASE_TAG: v0.3.5
  APK_NAME: HealthBridge-v0.3.6.apk
  CHECKSUM_NAME: HealthBridge-v0.3.6.sha256
  SOURCE_NAME: health-bridge-v0.3.6-source.zip
  PACKAGE_NAME: com.personal.healthbridge.reinstall
  VERSION_CODE: "12"
  VERSION_NAME: "0.3.6"
  EXPECTED_PUBLIC_CERT_SHA256: "98ec08ec0640003688d3c99a608cba45c75c0caea33e63d286fc640e4f454292"
  EXPECTED_PUBLIC_CERT_SHA1: "e31ae124f93d06f1784fac1f1eb6241b08bf7af2"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_BUNDLE_BASE64: ${{ secrets.HEALTHBRIDGE_PUBLIC_SIGNING_BUNDLE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore persistent public signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE_BASE64"
          rm -rf /tmp/healthbridge-public-signing
          mkdir -p /tmp/healthbridge-public-signing
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > /tmp/healthbridge-public-signing/bundle.tar.gz
          tar -xzf /tmp/healthbridge-public-signing/bundle.tar.gz -C /tmp/healthbridge-public-signing
          test -s /tmp/healthbridge-public-signing/key.pk8
          test -s /tmp/healthbridge-public-signing/cert.pem
          ACTUAL_SHA256="$(openssl x509 -in /tmp/healthbridge-public-signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          ACTUAL_SHA1="$(openssl x509 -in /tmp/healthbridge-public-signing/cert.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$ACTUAL_SHA256" = "$EXPECTED_PUBLIC_CERT_SHA256"
          test "$ACTUAL_SHA1" = "$EXPECTED_PUBLIC_CERT_SHA1"

      - name: Run tests and build unsigned release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align sign and verify stable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -P 16 -f -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk dist/app-aligned.apk
          "$BT/zipalign" -c -P 16 -v 4 dist/app-aligned.apk
          "$BT/apksigner" sign \
            --key /tmp/healthbridge-public-signing/key.pk8 \
            --cert /tmp/healthbridge-public-signing/cert.pem \
            --out "dist/$APK_NAME" \
            dist/app-aligned.apk
          rm dist/app-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "dist/$APK_NAME" | tee dist/signing-certificate.txt
          "$BT/zipalign" -c -P 16 -v 4 "dist/$APK_NAME" | tee dist/zipalign-verification.txt
          grep -q 'Verification successful' dist/zipalign-verification.txt
          NORMALIZED="$(grep -i 'Signer #1 certificate SHA-256 digest:' dist/signing-certificate.txt | head -n1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')"
          test "$NORMALIZED" = "$EXPECTED_PUBLIC_CERT_SHA256"
          "$BT/aapt" dump badging "dist/$APK_NAME" > dist/apk-badging.txt
          grep -q "package: name='$PACKAGE_NAME'" dist/apk-badging.txt
          grep -q "versionCode='$VERSION_CODE'" dist/apk-badging.txt
          grep -q "versionName='$VERSION_NAME'" dist/apk-badging.txt
          unzip -t "dist/$APK_NAME" >/dev/null
          (cd dist && sha256sum "$APK_NAME" > "$CHECKSUM_NAME")
          git archive --format=zip --output="dist/$SOURCE_NAME" "$GITHUB_SHA"

      - name: Preserve verified APK before publishing
        uses: actions/upload-artifact@v4
        with:
          name: HealthBridge-v0.3.6-verified-apk
          path: |
            dist/HealthBridge-v0.3.6.apk
            dist/HealthBridge-v0.3.6.sha256
            dist/signing-certificate.txt
            dist/zipalign-verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Prepare version tag
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish or refresh GitHub Release
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_TAG="$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            CREATED=0
            for attempt in 1 2 3 4 5; do
              if gh release create "$RELEASE_TAG" \
                --verify-tag \
                --repo "$GITHUB_REPOSITORY" \
                --title "Health Bridge 0.3.6" \
                --notes "In-place update from public 0.3.5. Adds the Health Bridge launcher icon. Keeps the same application ID and persistent public signing identity. APK native libraries remain 16KB zip-aligned."; then
                CREATED=1
                break
              fi
              sleep $((attempt * 2))
            done

            if [ "$CREATED" -ne 1 ]; then
              echo "Version-specific Release creation was rejected; using the existing public Release container." >&2
              gh release view "$FALLBACK_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
              PUBLISHED_TAG="$FALLBACK_RELEASE_TAG"
            fi
          fi

          gh release upload "$PUBLISHED_TAG" \
            "dist/$APK_NAME" \
            "dist/$CHECKSUM_NAME" \
            "dist/$SOURCE_NAME" \
            dist/signing-certificate.txt \
            dist/zipalign-verification.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          echo "published_tag=$PUBLISHED_TAG" >> "$GITHUB_OUTPUT"

      - name: Read back and verify published release asset
        shell: bash
        env:
          PUBLISHED_TAG: ${{ steps.publish.outputs.published_tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/healthbridge-release-readback
          mkdir -p /tmp/healthbridge-release-readback
          cd /tmp/healthbridge-release-readback
          gh release download "$PUBLISHED_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME"
          gh release download "$PUBLISHED_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CHECKSUM_NAME"
          gh release download "$PUBLISHED_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_NAME"
          sha256sum --check --strict "$CHECKSUM_NAME"
          unzip -t "$SOURCE_NAME" >/dev/null
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" > "$GITHUB_WORKSPACE/release-signature-readback.txt"
          "$BT/zipalign" -c -P 16 -v 4 "$APK_NAME" > "$GITHUB_WORKSPACE/release-zipalign-readback.txt"
          grep -q 'Verification successful' "$GITHUB_WORKSPACE/release-zipalign-readback.txt"
          NORMALIZED="$(grep -i 'Signer #1 certificate SHA-256 digest:' "$GITHUB_WORKSPACE/release-signature-readback.txt" | head -n1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')"
          test "$NORMALIZED" = "$EXPECTED_PUBLIC_CERT_SHA256"
          "$BT/aapt" dump badging "$APK_NAME" > "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "package: name='$PACKAGE_NAME'" "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "versionCode='$VERSION_CODE'" "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "versionName='$VERSION_NAME'" "$GITHUB_WORKSPACE/release-badging-readback.txt"

      - name: Record public release self-test
        shell: bash
        env:
          PUBLISHED_TAG: ${{ steps.publish.outputs.published_tag }}
        run: |
          set -euo pipefail
          mkdir -p .github
          cat > .github/release-selftest-report.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "run_id": "$GITHUB_RUN_ID",
            "source_sha": "$GITHUB_SHA",
            "version": "$VERSION_NAME",
            "version_tag": "$RELEASE_TAG",
            "release_container_tag": "$PUBLISHED_TAG",
            "mode": "persistent-public-signing",
            "public_package": "$PACKAGE_NAME",
            "public_certificate_sha256": "$EXPECTED_PUBLIC_CERT_SHA256",
            "public_certificate_sha1": "$EXPECTED_PUBLIC_CERT_SHA1",
            "apk_zip_alignment": "16KB-verified",
            "unit_tests": "success",
            "signed_apk": "verified",
            "release_readback": "verified",
            "update_from_public_0_3_4_supported": true,
            "future_public_updates_supported": true,
            "external_private_repo_dependency": false,
            "repository_secret_name": "HEALTHBRIDGE_PUBLIC_SIGNING_BUNDLE_BASE64",
            "google_authorization_mode": "account-picker-googleauthutil-direct-token",
            "google_android_client_id_embedded": false,
            "google_authorization_runtime_e2e": "requires_device_account_confirmation",
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-selftest-report.json
          git commit -m 'Record public Health Bridge 0.3.6 verification'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Clean signing material
        if: always()
        shell: bash
        run: rm -rf /tmp/healthbridge-public-signing
